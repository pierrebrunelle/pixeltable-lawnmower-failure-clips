# Pixeltable project configuration (https://docs.pixeltable.com).
# Entry 1 is your local database. Entry 2 is a Pixeltable Cloud database:
# replace 'pxt://<your-org>:<your-db>' with your own org and database before `pxt db update`.

[pixeltable]
psycopg_log_level = 'WARNING'

[[pixeltable.database]]
exclude = ['logs/**', '__pycache__/**', 'publish/**', 'output/**', 'probe_*', 'repro_*', 'scratch*', 'run.py', 'make_videos.py', 'data/**']

[[pixeltable.database]]
name = 'pxt://<your-org>:<your-db>'
cpu = 0.5
memory_mb = 2048
disk_gb = 10
workers = 1
system_dependencies = ['ffmpeg']
exclude = ['.venv/**', '__pycache__/**', '*.pyc', '.git/**', 'logs/**', '.env*', 'publish/**', 'output/**', 'probe_*', 'repro_*', 'scratch*', 'run.py', 'make_videos.py', 'data/**']
